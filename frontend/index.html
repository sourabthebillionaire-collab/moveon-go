<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- ── PWA Core ── -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0D47A1" />

    <!-- ── App info ── -->
    <title>MoveOn Go</title>
    <meta name="description" content="Real-time bus tracking, auto, cab and bike booking. Live GPS. Book rides instantly." />
    <meta name="keywords" content="bus tracker, auto booking, cab booking, live tracking, Odisha, India" />
    <meta name="author" content="MoveOn Go" />

    <!-- ── iOS PWA support ── -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MoveOn Go" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="apple-touch-startup-image" href="/logo.png" />

    <!-- ── Favicon ── -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="shortcut icon" href="/logo.png" />

    <!-- ── Open Graph (share preview) ── -->
    <meta property="og:title" content="MoveOn Go" />
    <meta property="og:description" content="Real-time bus, auto and cab tracking for India" />
    <meta property="og:image" content="/logo.png" />
    <meta property="og:type" content="website" />

    <!-- ── Mobile optimizations ── -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-TileColor" content="#0D47A1" />
    <meta name="msapplication-TileImage" content="/logo.png" />

    <!-- ── Fonts preload for speed ── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>z
